<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mon Mini Réseau Social</title>

<style>
body{
font-family: Arial;
background:#f0f2f5;
padding:20px;
}

textarea{
width:100%;
height:60px;
}

.post{
background:white;
padding:10px;
margin-top:15px;
border-radius:8px;
}

img{
max-width:100%;
margin-top:10px;
border-radius:6px;
}

button{
margin-top:10px;
padding:6px;
}
</style>

</head>

<body>

<h2>Mon Mini Réseau Social</h2>

<input type="file" id="profileInput">
<br><br>

<textarea id="textInput" placeholder="Écris un message"></textarea>

<br><br>

<input type="file" id="imageInput">

<br><br>

<button onclick="publish()">Publier</button>

<hr>

<div id="feed"></div>

<script>

let profileImage = ""
let posts = JSON.parse(localStorage.getItem("posts")) || []

document.getElementById("profileInput").addEventListener("change",function(e){

let reader = new FileReader()

reader.onload=function(){
profileImage = reader.result
}

reader.readAsDataURL(e.target.files[0])

})

function publish(){

let text = document.getElementById("textInput").value
let file = document.getElementById("imageInput").files[0]

if(!text && !file){
alert("Écris un message ou ajoute une image")
return
}

let reader = new FileReader()

reader.onload=function(){

let post = {
text:text,
image:file ? reader.result : "",
profile:profileImage,
likes:0
}

posts.unshift(post)

localStorage.setItem("posts",JSON.stringify(posts))

showPosts()

}

if(file){
reader.readAsDataURL(file)
}else{
reader.onload()
}

document.getElementById("textInput").value=""
document.getElementById("imageInput").value=""

}

function like(i){

posts[i].likes++

localStorage.setItem("posts",JSON.stringify(posts))

showPosts()

}

function showPosts(){

let feed = document.getElementById("feed")

feed.innerHTML=""

posts.forEach((p,i)=>{

let div = document.createElement("div")

div.className="post"

div.innerHTML = `
${p.profile ? `<img src="${p.profile}" width="40" style="border-radius:50%">` : ""}

<p>${p.text}</p>

${p.image ? `<img src="${p.image}">` : ""}

<br>

<button onclick="like(${i})">👍 Like (${p.likes})</button>
`

feed.appendChild(div)

})

}

showPosts()

</script>

</body>
</html>
