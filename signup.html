<!DOCTYPE html>
<html>
<head>
<title>Barou Tech - Créer un compte</title>
<style>
body{font-family: Arial; background:#111827; color:white; text-align:center; margin-top:50px;}
h1{color:#22c55e;}
input{padding:10px; margin:10px; width:220px; border-radius:6px; border:none;}
button{padding:12px 25px; font-size:16px; background:#22c55e; border:none; border-radius:8px; color:white; cursor:pointer;}
</style>
</head>
<body>

<h1>Créer un compte</h1>

<form onsubmit="return false;">
  <input type="email" id="email" placeholder="Email" required><br>
  <input type="password" id="password" placeholder="Mot de passe" required><br>
  <button onclick="signup()">Créer un compte</button>
</form>

<script>
function signup(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  if(email === "" || password === ""){
    alert("Remplis tous les champs !");
    return;
  }

  let data = JSON.parse(localStorage.getItem("baroutech") || '{"utilisateurs":{}}');
  if(data.utilisateurs[email]){
    alert("Cet email existe déjà !");
    return;
  }

  data.utilisateurs[email] = []; // aucun message pour l’instant
  localStorage.setItem("baroutech", JSON.stringify(data));

  alert("Compte créé ! Tu peux maintenant te connecter");
  window.location.href = "login.html";
}
</script>

</body>
</html>
