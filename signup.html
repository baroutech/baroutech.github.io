<!DOCTYPE html>
<html>
<head>
<title>Créer un compte - Barou Tech</title>
<style>
body{
  font-family: Arial;
  background:#111827;
  color:white;
  text-align:center;
  margin-top:50px;
}
h1{
  color:#22c55e;
}
input{
  padding:10px;
  margin:10px;
  width:200px;
  border-radius:5px;
  border:none;
}
button{
  padding:12px 25px;
  font-size:18px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>Créer un compte</h1>

<form>
  <input type="text" placeholder="Nom" required><br>
  <input type="email" placeholder="Email" required><br>
  <input type="password" placeholder="Mot de passe" required><br>
  <button type="submit">S’inscrire</button>
</form>

</body>
</html>
