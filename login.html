<!DOCTYPE html>
<html>
<head>
<title>Connexion - Barou Tech</title>
<style>
body{
  font-family: Arial;
  background:#111827;
  color:white;
  text-align:center;
  margin-top:50px;
}
h1{
  color:#22c55e;
}
input{
  padding:10px;
  margin:10px;
  width:200px;
  border-radius:5px;
  border:none;
}
button{
  padding:12px 25px;
  font-size:18px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}
</style>
</head>
<body>

<h1>Se connecter</h1>

<form>
  <input type="email" placeholder="Email" required><br>
  <input type="password" placeholder="Mot de passe" required><br>
  <button type="submit">Se connecter</button>
</form>

<!-- Firebase scripts -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>

<script>
  // Configuration Firebase à remplacer par la tienne
  const firebaseConfig = {
    apiKey: "xxxxxxxxxxxx",
    authDomain: "baroutech.firebaseapp.com",
    projectId: "baroutech",
    storageBucket: "baroutech.appspot.com",
    messagingSenderId: "xxxxxxx",
    appId: "xxxxxxxx"
  };

  // Initialize Firebase
  const app = firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  const form = document.querySelector('form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = form.querySelector('input[type="email"]').value;
    const password = form.querySelector('input[type="password"]').value;
    auth.signInWithEmailAndPassword(email, password)
      .then(userCredential => {
        alert('Connecté avec succès !');
        form.reset();
      })
      .catch(error => alert(error.message));
  });
</script>

</body>
</html>
