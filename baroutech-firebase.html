<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Barou Tech Firebase</title>
  <style>
    body { font-family: Arial; background: #111827; color: white; text-align: center; margin-top: 50px; }
    h1 { color: #22c55e; }
    input, button { padding: 10px; margin: 5px; border-radius: 5px; border: none; }
    button { background: #22c55e; color: white; cursor: pointer; }
    .post { border: 1px solid #22c55e; padding: 10px; margin: 10px auto; width: 300px; text-align: left; }
    .post img { max-width: 100%; }
  </style>
</head>
<body>

<h1>Bienvenue sur Barou Tech 🚀</h1>

<div id="authSection">
  <h2>Créer un compte</h2>
  <input type="text" id="signupName" placeholder="Nom" required><br>
  <input type="email" id="signupEmail" placeholder="Email" required><br>
  <input type="password" id="signupPassword" placeholder="Mot de passe" required><br>
  <button onclick="signup()">S'inscrire</button>
  <p>Ou <button onclick="showLogin()">Se connecter</button></p>
</div>

<div id="loginSection" style="display:none">
  <h2>Connexion</h2>
  <input type="email" id="loginEmail" placeholder="Email" required><br>
  <input type="password" id="loginPassword" placeholder="Mot de passe" required><br>
  <button onclick="login()">Se connecter</button>
  <p>Ou <button onclick="showSignup()">Créer un compte</button></p>
</div>

<div id="dashboard" style="display:none">
  <h2>Dashboard</h2>
  <textarea id="postInput" placeholder="Écris quelque chose..."></textarea><br>
  <input type="file" id="imageInput"><br>
  <button onclick="publishPost()">Publier</button>
  <h3>Fil d'actualités</h3>
  <div id="postsContainer"></div>
  <button onclick="logout()">Se déconnecter</button>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

<script>
// 🔹 Remplace avec ton firebaseConfig
const firebaseConfig = {
  apiKey: "API_KEY",
  authDomain: "AUTH_DOMAIN",
  projectId: "PROJECT_ID",
  storageBucket: "STORAGE_BUCKET",
  messagingSenderId: "MESSAGING_SENDER_ID",
  appId: "APP_ID",
  measurementId: "MEASUREMENT_ID"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

// Afficher sections
function showLogin(){ document.getElementById("authSection").style.display="none"; document.getElementById("loginSection").style.display="block"; }
function showSignup(){ document.getElementById("loginSection").style.display="none"; document.getElementById("authSection").style.display="block"; }

// 🔹 Sign up
function signup(){
  const name = document.getElementById("signupName").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value.trim();
  if(!name || !email || !password){ alert("Remplis tous les champs !"); return; }

  auth.createUserWithEmailAndPassword(email,password)
    .then(userCredential => {
      const user = userCredential.user;
      db.collection("users").doc(user.uid).set({
        name: name,
        avatar: "https://i.pravatar.cc/50?u="+user.uid
      }).then(()=>{ alert("Compte créé !"); loginFirebase(email,password); });
    })
    .catch(error=>alert(error.message));
}

// 🔹 Login
function login(){ 
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value.trim();
  loginFirebase(email,password);
}
function loginFirebase(email,password){
  auth.signInWithEmailAndPassword(email,password)
    .then(userCredential=>{ showDashboard(); loadPosts(); })
    .catch(error=>alert(error.message));
}

// 🔹 Logout
function logout(){ auth.signOut().then(()=>{document.getElementById("dashboard").style.display="none"; document.getElementById("loginSection").style.display="block";}); }

// 🔹 Dashboard
function showDashboard(){ document.getElementById("authSection").style.display="none"; document.getElementById("loginSection").style.display="none"; document.getElementById("dashboard").style.display="block"; }

// 🔹 Publier post
function publishPost(){
  const text = document.getElementById("postInput").value.trim();
  const imageFile = document.getElementById("imageInput").files[0];
  if(text=="" && !imageFile){ alert("Écris un message ou choisis une image !"); return; }

  auth.onAuthStateChanged(user=>{
    if(user){
      let postData={text:text,time:Date.now(),likes:0,uid:user.uid};
      if(imageFile){
        const storageRef = storage.ref('posts/'+user.uid+'/'+Date.now()+'_'+imageFile.name);
        storageRef.put(imageFile).then(()=>{
          storageRef.getDownloadURL().then(url=>{
            postData.image=url;
            db.collection("posts").add(postData).then(()=>{ displayPosts(); });
          });
        });
      } else {
        db.collection("posts").add(postData).then(()=>{ displayPosts(); });
      }
    }
  });
}

// 🔹 Afficher posts
function loadPosts(){
  db.collection("posts").orderBy("time","desc").onSnapshot(snapshot=>{
    displayPosts(snapshot.docs.map(doc=>({id:doc.id,...doc.data()})));
  });
}
function displayPosts(postsArray){
  const container = document.getElementById("postsContainer");
  container.innerHTML="";
  postsArray.forEach(post=>{
    const div = document.createElement("div");
    div.className="post";
    div.innerHTML=`<p>${post.text || ""}</p>`+
                  `${post.image?'<img src="'+post.image+'">':''}`+
                  `<p>Likes: ${post.likes} <button onclick="likePost('${post.id}',${post.likes})">Like</button></p>`+
                  `${post.uid===auth.currentUser.uid?'<button onclick="deletePost(\''+post.id+'\')">Supprimer</button>':''}`;
    container.appendChild(div);
  });
}

// 🔹 Like & Delete
function likePost(id,current){ db.collection("posts").doc(id).update({likes:current+1}); }
function deletePost(id){ db.collection("posts").doc(id).delete(); }
</script>

</body>
</html>
