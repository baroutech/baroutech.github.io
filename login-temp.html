<!DOCTYPE html>
<html>
<head>
<title>Connexion - Barou Tech</title>

<style>
body{
font-family: Arial;
background:#111827;
color:white;
text-align:center;
margin-top:50px;
}

h1{
color:#22c55e;
}

input{
padding:10px;
margin:10px;
width:220px;
border-radius:6px;
border:none;
}

button{
padding:12px 25px;
font-size:16px;
background:#22c55e;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
}
</style>

</head>

<body>

<h1>Se connecter</h1>

<input type="email" placeholder="Email" id="email"><br>

<input type="password" placeholder="Mot de passe" id="password"><br>

<button onclick="login()">Se connecter</button>

<script>

function login(){

let email = document.getElementById("email").value
let password = document.getElementById("password").value

if(email === "" || password === ""){
alert("Remplis tous les champs !")
return
}

window.location.href = "dashboard.html"

}

</script>

</body>
</html>
