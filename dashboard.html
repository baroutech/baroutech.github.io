<!DOCTYPE html>
<html>
<head>
<title>Barou Tech - Dashboard</title>
<style>
body{font-family: Arial; background:#111827; color:white; text-align:center; margin-top:50px;}
h1{color:#22c55e;}
textarea{width:300px; height:80px; padding:10px; border-radius:6px; border:none;}
button{margin-top:10px; padding:12px 25px; font-size:16px; background:#22c55e; border:none; border-radius:8px; color:white; cursor:pointer;}
#posts{margin-top:30px; text-align:left; max-width:500px; margin-left:auto; margin-right:auto;}
.post{background:#1f2937; padding:10px; margin-bottom:10px; border-radius:6px;}
</style>
</head>
<body>

<h1>Barou Tech Dashboard 🚀</h1>

<textarea id="postInput" placeholder="Écris quelque chose..."></textarea><br>
<button onclick="publishPost()">Publier</button>

<div id="posts"></div>

<script>
// Charger les données
let data = JSON.parse(localStorage.getItem("baroutech") || '{"utilisateurs":{}, "connecte":""}');
let currentUser = data.connecte || "";
if(!currentUser){
  alert("Tu dois te connecter !");
  window.location.href = "login.html";
}

let posts = data.utilisateurs[currentUser] || [];

function displayPosts(){
  const postsDiv = document.getElementById("posts");
  postsDiv.innerHTML = "";
  posts.forEach(msg => {
    const post = document.createElement("div");
    post.className = "post";
    post.innerText = msg;
    postsDiv.appendChild(post);
  });
}

function publishPost(){
  const input = document.getElementById("postInput");
  const text = input.value.trim();
  if(text === ""){
    alert("Écris un message !");
    return;
  }
  posts.push(text);
  data.utilisateurs[currentUser] = posts;
  localStorage.setItem("baroutech", JSON.stringify(data));
  input.value = "";
  displayPosts();
}

// Afficher les messages au chargement
displayPosts();
</script>

</body>
</html>
