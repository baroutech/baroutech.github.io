<!DOCTYPE html>
<html>
<head>
<title>Barou Tech - Dashboard</title>

<style>
body{
font-family: Arial;
background:#111827;
color:white;
text-align:center;
margin-top:50px;
}

h1{
color:#22c55e;
}

textarea{
width:300px;
height:80px;
padding:10px;
border-radius:6px;
border:none;
}

button{
margin-top:10px;
padding:12px 25px;
font-size:16px;
background:#22c55e;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
}

#posts{
margin-top:30px;
}
</style>
</head>

<body>

<h1>Barou Tech Dashboard 🚀</h1>

<textarea id="postInput" placeholder="Écris quelque chose..."></textarea><br>

<button onclick="publishPost()">Publier</button>

<div id="posts"></div>

<script>

function publishPost(){

let text = document.getElementById("postInput").value

if(text === ""){
alert("Écris un message !");
return
}

let post = document.createElement("p")
post.innerText = text

document.getElementById("posts").appendChild(post)

document.getElementById("postInput").value = ""

}

</script>

</body>
</html>
